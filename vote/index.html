<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>法官助手</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 引入 Lucide 图标库 -->
    <script src="https://cdn.jsdelivr.net/npm/lucide/dist/umd/lucide.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020617; /* slate-950 */
            color: #e2e8f0; /* slate-200 */
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* 隐藏原始的 SVG 图标，因为我们会用 Lucide 替换它们 */
        i[data-lucide] {
            display: inline-block;
        }

        /* 移动端优化：禁止长按菜单和选中文本 */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* 允许输入框等元素选中文本（如果有的话） */
        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        /* 滚动条隐藏但保持功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 角色颜色标记 */
        .role-tag-wolf { background: linear-gradient(to right, #fad0c4, #ff9a9e); color: #7f1d1d; border: 1px solid #d16b71; font-weight: 800; }
        .role-tag-god { background: linear-gradient(to right, #d4ebd0, #a0c49d); color: #064e3b; border: 1px solid #7b9e76; font-weight: 800; }
        .role-tag-villager { background: linear-gradient(to right, #fff5d1, #f2d77d); color: #713f12; border: 1px solid #c9aa4b; font-weight: 800; }
        .role-tag-unknown { background: rgba(30, 41, 59, 0.2); color: #94a3b8; border: 1px solid rgba(30, 41, 59, 0.4); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // Supabase 初始化配置与容灾保护
        const SUPABASE_URL = 'https://nqwzybdymdzgvhtvjugo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LychNAytZzXicbp23aJ9fg_P3o-JD8Y';
        let supabaseClient = null;
        
        try {
            if (typeof window.supabase !== 'undefined') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } else {
                console.error('Supabase SDK core script was not loaded. Check internet access to jsdelivr.');
                setTimeout(() => {
                    alert('Supabase 核心代码库加载失败。这通常是因为您的网络无法访问 cdn.jsdelivr.net。建议您开启全局代理，或尝试切换网络环境。');
                }, 1000);
            }
        } catch (err) {
            console.error('Supabase initialization failed:', err);
        }

        // 全局状态管理
        const state = {
            phase: 'setup', // 'setup' | 'day' | 'voting' | 'result' | 'settlement' | 'campaign'
            localCampaigning: [], // 暂存竞选玩家ID
            players: [], // 12个座位玩家信息
            gameState: null, // 存储云端完整状态
            wolfPool: new Set(), // 存储狼人角色
            votes: {}, // 投票数据 { voterId: targetId | 'abstain' }
            currentVoterIndex: 0, // 当前投票玩家索引
            voteHistory: [], // 投票历史
            roundNumber: 1, // 当前轮次
            deathMenuId: null // 正在选择死因的玩家ID
        };

        // 状态更新与渲染辅助函数
        function setState(updates) {
            Object.assign(state, updates);
            render();
        }

        // 计算存活玩家
        function getAlivePlayers() {
            return state.players.filter(p => p.alive);
        }

        // 计算投票统计结果
        function getVoteResults() {
            const alive = getAlivePlayers();
            const counts = {};
            const details = {};
            alive.forEach(p => { 
                counts[p.id] = 0; 
                details[p.id] = []; 
            });
            
            let abstainCount = 0;
            const abstainDetails = [];

            Object.entries(state.votes).forEach(([voterSeat, targetId]) => {
                const voter = state.players.find(p => p.id === parseInt(voterSeat));
                if (!voter) return;
                const weight = voter.isSheriff ? 1.5 : 1;
                
                if (targetId === 'abstain') {
                    abstainCount += weight;
                    abstainDetails.push(voter.isSheriff ? `${voter.name}(1.5)` : voter.name);
                } else {
                    counts[targetId] = (counts[targetId] || 0) + weight;
                    if (!details[targetId]) details[targetId] = [];
                    details[targetId].push(voter.isSheriff ? `${voter.name}(1.5)` : voter.name);
                }
            });

            const maxVotes = Math.max(0, ...Object.values(counts));
            const isTie = maxVotes > 0 && Object.values(counts).filter(v => v === maxVotes).length > 1;
            const targetsWithMax = Object.keys(counts).filter(id => counts[id] === maxVotes).map(Number);

            return { counts, details, abstainCount, abstainDetails, maxVotes, isTie, targetsWithMax };
        }

        // 计算结算页面分值
        function getSettlementData() {
            return state.players.filter(p => p.role === 'god' || p.role === 'villager').map(p => {
                let score = 0;
                const details = [];
                state.voteHistory.forEach(history => {
                    const targetId = history.votes[p.id];
                    if (targetId && targetId !== 'abstain') {
                        const target = state.players.find(tp => tp.id === targetId);
                        const isHit = target?.role === 'wolf';
                        score += isHit ? 0.5 : -0.5;
                        details.push({ round: history.round, target: target?.name || '未知', isHit });
                    } else {
                        details.push({ round: history.round, target: '弃票', isHit: null });
                    }
                });
                return { ...p, score, details };
            }).sort((a, b) => a.id - b.id);
        }

        // 数据同步逻辑
        async function fetchInitialData() {
            if (!supabaseClient) return;
            try {
                // 1. 获取玩家基础头像库
                const { data: directory } = await supabaseClient.from('player_directory').select('*');
                const playerMap = {};
                directory?.forEach(p => playerMap[p.id] = p);

                // 2. 获取当前游戏状态
                const { data: stateData } = await supabaseClient.from('current_game_state').select('*').eq('id', 1).single();
                if (stateData) {
                    syncPlayersFromState(stateData, playerMap);
                    handleStateUpdate(stateData);
                }
            } catch (err) {
                console.error('Initial fetch error:', err);
            }
        }

        function handleStateUpdate(gameState) {
            state.gameState = gameState;
            if (gameState.standby_config?.role_pools?.wolves) {
                const wolves = gameState.standby_config.role_pools.wolves.split(/[,，\s]+/).filter(Boolean);
                state.wolfPool = new Set(wolves);
            }
            refreshPlayerDetails(gameState);
        }

        async function refreshPlayerDetails(gameState) {
            if (!supabaseClient) return;
            try {
                const { data: directory } = await supabaseClient.from('player_directory').select('*');
                const playerMap = {};
                directory?.forEach(p => playerMap[p.id] = p);
                syncPlayersFromState(gameState, playerMap);
                render();
            } catch (err) {
                console.error('Refresh player details error:', err);
            }
        }

        function syncPlayersFromState(gameState, playerMap) {
            const wolfSet = new Set();
            const godSet = new Set();
            const villagerSet = new Set();
            
            if (gameState.standby_config?.role_pools) {
                const pools = gameState.standby_config.role_pools;
                if (pools.wolves) pools.wolves.split(/[,，\s]+/).filter(Boolean).forEach(w => wolfSet.add(w));
                if (pools.gods) pools.gods.split(/[,，\s]+/).filter(Boolean).forEach(g => godSet.add(g));
                if (pools.villagers) pools.villagers.split(/[,，\s]+/).filter(Boolean).forEach(v => villagerSet.add(v));
            }

            const prevPlayers = state.players;
            state.players = Array.from({ length: 12 }, (_, i) => {
                const seatNumber = i + 1;
                const s = gameState.seats?.find(seat => seat.seat_number === seatNumber);
                const localP = prevPlayers.find(p => p.id === seatNumber);
                
                if (s) {
                    const profile = playerMap[s.player_id] || {};
                    const identity = s.identity || '';
                    let role = 'unknown';
                    if (identity) {
                        if (wolfSet.has(identity) || identity.includes('狼')) role = 'wolf';
                        else if (villagerSet.has(identity) || identity.includes('民')) role = 'villager';
                        else role = 'god';
                    }

                    let isAlive = s.is_alive !== false;
                    let cause = isAlive ? null : (s.death_cause || 'night');

                    // 核心修复：如果不是在准备阶段，优先保留本地的死亡状态，防止被外部（如选择警长）重置
                    if (localP && localP.alive === false) {
                        isAlive = false;
                        cause = localP.deathCause;
                    }

                    return {
                        id: s.seat_number,
                        db_player_id: s.player_id,
                        name: profile.name || `${s.seat_number}号位`,
                        avatar: profile.avatar_url || `https://ui-avatars.com/api/?name=${s.seat_number}&background=random`,
                        identity: identity || '未知',
                        alive: isAlive,
                        isSheriff: gameState.sheriff_seat === seatNumber,
                        isCampaigning: s.is_campaigning === true,
                        role: role,
                        deathCause: cause
                    };
                } else {
                    return {
                        id: seatNumber,
                        db_player_id: null,
                        name: `${seatNumber}号位`,
                        avatar: `https://ui-avatars.com/api/?name=${seatNumber}&background=slate&color=fff`,
                        identity: '未上座',
                        alive: true,
                        isSheriff: false,
                        isCampaigning: false,
                        role: 'unknown',
                        deathCause: null
                    };
                }
            });
        }

        const setSheriffInDB = async (seatNumber) => {
            if (!supabaseClient) { alert('数据库连接未初始化，无法设置警长'); return; }
            try {
                const { data: current } = await supabaseClient.from('current_game_state').select('seats').eq('id', 1).single();
                
                // 任命警长后，自动取消所有人的竞选状态
                let newSeats = current?.seats || [];
                if (newSeats.length > 0) {
                    newSeats = newSeats.map(s => ({ ...s, is_campaigning: false }));
                }

                const { error } = await supabaseClient.from('current_game_state').update({ 
                    sheriff_seat: seatNumber,
                    seats: newSeats
                }).eq('id', 1);
                if (error) throw error;
            } catch (err) {
                alert('同步失败: ' + err.message);
            }
        };

        const syncStatusToDB = async (updatedPlayers) => {
            if (!supabaseClient) return;
            try {
                const { data: current } = await supabaseClient.from('current_game_state').select('seats').eq('id', 1).single();
                if (!current?.seats) return;

                const newSeats = current.seats.map(s => {
                    const localPlayer = updatedPlayers.find(p => p.id === s.seat_number);
                    if (localPlayer) {
                        return {
                            ...s,
                            is_alive: localPlayer.alive,
                            death_cause: localPlayer.deathCause
                        };
                    }
                    return s;
                });

                await supabaseClient.from('current_game_state').update({ seats: newSeats }).eq('id', 1);
            } catch (err) {
                console.error('Sync status error:', err);
            }
        };

        // 按钮及界面交互绑定的全局函数
        window.handleStartGame = function() {
            setState({
                phase: 'day',
                votes: {},
                voteHistory: [],
                roundNumber: 1
            });
        };

        window.enterCampaignPhase = function() {
            setState({
                localCampaigning: state.players.filter(p => p.isCampaigning).map(p => p.id),
                phase: 'campaign'
            });
        };

        window.handleSheriffChange = function(val) {
            setSheriffInDB(parseInt(val));
        };

        window.togglePlayerAlive = function(id) {
            const p = state.players.find(player => player.id === id);
            if (!p) return;
            if (!p.alive) {
                const updatedPlayers = state.players.map(player => 
                    player.id === id ? { ...player, alive: true, deathCause: null } : player
                );
                setState({ players: updatedPlayers });
                syncStatusToDB(updatedPlayers);
            } else {
                setState({ deathMenuId: id });
            }
        };

        window.confirmDeath = function(id, cause) {
            const updatedPlayers = state.players.map(p => 
                p.id === id ? { ...p, alive: false, deathCause: cause } : p
            );
            setState({
                players: updatedPlayers,
                deathMenuId: null
            });
            syncStatusToDB(updatedPlayers);
        };

        window.startVoting = function() {
            setState({
                votes: {},
                currentVoterIndex: 0,
                phase: 'voting'
            });
        };

        window.handleReviveAll = function() {
            if (window.confirm('确定要全员复活并重新计算本局投票吗？')) {
                const updatedPlayers = state.players.map(p => ({ ...p, alive: true, deathCause: null }));
                setState({
                    players: updatedPlayers,
                    votes: {},
                    voteHistory: [],
                    roundNumber: 1,
                    phase: 'day'
                });
                syncStatusToDB(updatedPlayers);
            }
        };

        window.toggleCampaigningLocal = function(id) {
            const isSelected = state.localCampaigning.includes(id);
            let newList;
            if (isSelected) {
                newList = state.localCampaigning.filter(x => x !== id);
            } else {
                newList = [...state.localCampaigning, id];
            }
            setState({ localCampaigning: newList });
        };

        window.confirmCampaigning = async function() {
            if (!supabaseClient) { alert('数据库连接未初始化'); return; }
            try {
                const { data: current } = await supabaseClient.from('current_game_state').select('seats').eq('id', 1).single();
                if (!current?.seats) return;

                const newSeats = current.seats.map(s => ({
                    ...s,
                    is_campaigning: state.localCampaigning.includes(s.seat_number)
                }));

                await supabaseClient.from('current_game_state').update({ seats: newSeats }).eq('id', 1);
                setState({ phase: 'day' });
            } catch (err) {
                console.error('Confirm campaigning error:', err);
                alert('同步失败，请检查网络');
            }
        };

        window.castVote = function(targetId) {
            const alive = getAlivePlayers();
            const currentVoter = alive[state.currentVoterIndex];
            const newVotes = { ...state.votes, [currentVoter.id]: targetId };
            
            if (state.currentVoterIndex + 1 < alive.length) {
                setState({
                    votes: newVotes,
                    currentVoterIndex: state.currentVoterIndex + 1
                });
            } else {
                setState({
                    votes: newVotes,
                    phase: 'result'
                });
            }
        };

        window.prevVoter = function() {
            if (state.currentVoterIndex > 0) {
                setState({ currentVoterIndex: state.currentVoterIndex - 1 });
            }
        };

        window.executeElimination = function(targetId) {
            const target = state.players.find(p => p.id === targetId);
            if (window.confirm(`确定要放逐 ${target?.name} 吗？`)) {
                archiveVotes();
                const updatedPlayers = state.players.map(p => p.id === targetId ? { ...p, alive: false, deathCause: '放逐' } : p);
                setState({
                    players: updatedPlayers,
                    phase: 'day'
                });
                syncStatusToDB(updatedPlayers);
            }
        };

        window.archiveVotes = function() {
            setState({
                voteHistory: [...state.voteHistory, { round: state.roundNumber, votes: { ...state.votes } }],
                roundNumber: state.roundNumber + 1
            });
        };

        window.confirmAndContinueResult = function() {
            archiveVotes();
            setState({ phase: 'day' });
        };

        window.uploadScores = async function() {
            if (!supabaseClient) { alert('数据库连接未初始化'); return; }
            try {
                const { data: existing } = await supabaseClient.from('current_game_state').select('standby_config').eq('id', 1).single();
                const newCorrections = Array(12).fill(0);
                
                const settlementData = getSettlementData();
                state.players.forEach(p => {
                    if (p.id >= 1 && p.id <= 12) {
                        if (p.role === 'god' || p.role === 'villager') {
                            const sData = settlementData.find(s => s.id === p.id);
                            newCorrections[p.id - 1] = sData ? sData.score : 0;
                        } else {
                            newCorrections[p.id - 1] = 0;
                        }
                    }
                });

                const mergedConfig = {
                    ...(existing?.standby_config || {}),
                    score_corrections: newCorrections
                };

                const { error } = await supabaseClient.from('current_game_state')
                    .update({ standby_config: mergedConfig })
                    .eq('id', 1);

                if (error) throw error;
                alert('分值已成功同步至后台结算区域！');
            } catch (err) {
                alert('同步失败: ' + err.message);
            }
        };

        // 各阶段的 HTML 渲染模块
        function renderSetup() {
            const setupName = state.gameState?.setup_name || '自定义版型';
            return `
                <div class="flex flex-col items-center justify-center h-full space-y-6 animate-fade-in">
                    <div class="text-center">
                        <img src="./logo.png" alt="Logo" class="h-28 mx-auto mb-8 object-contain" />
                        <h1 class="text-3xl font-bold text-slate-100 tracking-wider">法官助手</h1>
                        <p class="text-slate-400 mt-2 text-sm">已与云端同步，准备就绪</p>
                    </div>

                    <div class="w-full max-w-xs bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
                        <div class="space-y-4 mb-6">
                            <div class="p-5 bg-slate-900/50 rounded-xl border border-slate-700/50 text-center">
                                <p class="text-[10px] text-slate-500 mb-3 uppercase tracking-[0.2em]">当前版型</p>
                                <div class="text-2xl text-slate-100 font-black tracking-tight">
                                    ${setupName}
                                </div>
                            </div>
                        </div>
                        
                        <button 
                            onclick="handleStartGame()"
                            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 px-4 rounded-xl shadow-lg shadow-indigo-900/50 flex items-center justify-center space-x-2 transition active:scale-95"
                        >
                            <i data-lucide="play" class="w-5 h-5"></i>
                            <span>开始游戏</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderDay() {
            const aliveList = getAlivePlayers();
            const sheriffSeat = state.gameState?.sheriff_seat || 0;
            
            let selectOptions = '<option value="0">无</option>';
            for (let i = 1; i <= 12; i++) {
                selectOptions += `<option value="${i}" ${sheriffSeat === i ? 'selected' : ''}>${i}号</option>`;
            }

            let playersCards = '';
            state.players.forEach(p => {
                let roleClass = 'role-tag-unknown';
                if (p.role === 'wolf') roleClass = 'role-tag-wolf';
                else if (p.role === 'god') roleClass = 'role-tag-god';
                else if (p.role === 'villager') roleClass = 'role-tag-villager';

                let playerImgClass = p.alive ? 'border-indigo-500/50' : 'border-slate-700 grayscale';
                let seatBgClass = p.alive ? 'bg-indigo-600 text-white border-indigo-400' : 'bg-slate-800 text-slate-500 border-slate-700';
                let cardBgClass = p.alive ? 'bg-slate-800 border-slate-700 shadow-md hover:border-indigo-500/50' : 'bg-slate-900/50 border-slate-800/50 opacity-60';
                let heartIcon = p.alive ? 'heart' : 'skull';
                let heartIconColor = p.alive ? '' : 'text-rose-500';

                let deathCauseTag = '';
                if (!p.alive) {
                    let rotation = (p.deathCause === 'exiled' || p.deathCause === '放逐') ? 'rotate-12' : '-rotate-12';
                    let causeBg = (p.deathCause === 'exiled' || p.deathCause === '放逐') ? 'bg-rose-600/90 border-rose-400' : 'bg-slate-700/90 border-slate-500';
                    let causeText = p.deathCause === 'night' ? '昨夜' : (p.deathCause === 'exiled' ? '放逐' : p.deathCause);
                    
                    deathCauseTag = `
                        <div class="absolute inset-0 flex items-center justify-center ${rotation} pointer-events-none">
                            <div class="${causeBg} text-white text-[8px] font-black px-1 py-0.5 rounded border shadow-lg whitespace-nowrap">
                                ${causeText}
                            </div>
                        </div>
                    `;
                }

                let sheriffTag = p.isSheriff ? `
                    <div class="bg-gradient-to-b from-red-500 to-red-700 text-white text-[8px] font-black px-1 py-0.5 rounded border border-red-400 shadow-sm flex flex-col items-center leading-none">
                        <span>警</span>
                        <span class="mt-0.5">长</span>
                    </div>
                ` : '';

                let campaigningTag = p.isCampaigning ? `
                    <div class="bg-gradient-to-b from-rose-500 to-rose-700 text-white text-[8px] font-black px-1 py-0.5 rounded border border-rose-400 shadow-sm flex flex-col items-center leading-none">
                        <span>上</span>
                        <span class="mt-0.5">警</span>
                    </div>
                ` : '';

                playersCards += `
                    <div 
                        onclick="togglePlayerAlive(${p.id})"
                        class="relative p-3 rounded-xl border flex items-center space-x-3 transition cursor-pointer active:scale-95 ${cardBgClass}"
                    >
                        <div class="relative flex-shrink-0">
                            <img src="${p.avatar}" class="w-10 h-10 rounded-full object-cover border-2 ${playerImgClass}" />
                            <div class="absolute -top-1 -left-1 text-[10px] w-5 h-5 rounded-full flex items-center justify-center border font-bold ${seatBgClass}">
                                ${p.id}
                            </div>
                            ${deathCauseTag}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="text-sm font-bold truncate text-slate-100">${p.name}</h3>
                            <div class="flex items-start space-x-1 mt-1">
                                <p class="text-[10px] font-bold px-1.5 py-0.5 rounded inline-block ${roleClass}">
                                    ${p.identity}
                                </p>
                                ${sheriffTag}
                                ${campaigningTag}
                            </div>
                        </div>
                        <div class="p-1 text-slate-500">
                            <i data-lucide="${heartIcon}" class="w-4 h-4 ${heartIconColor}"></i>
                        </div>
                    </div>
                `;
            });

            return `
                <div class="flex flex-col h-full animate-fade-in">
                    <div class="flex justify-between items-center mb-6 pt-2">
                        <div class="flex-1">
                            <button 
                                onclick="enterCampaignPhase()"
                                class="bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-black px-3 py-1.5 rounded-lg shadow-lg shadow-indigo-900/40 flex items-center justify-center transition active:scale-95"
                            >
                                <span>上警</span>
                            </button>
                            <p class="text-slate-500 text-[10px] mt-1 ml-0.5 font-medium tracking-tight">
                                存活: <span class="text-indigo-400 font-bold">${aliveList.length}</span>/${state.players.length}
                            </p>
                        </div>
                        <div class="flex-shrink-0 px-2">
                            <img src="./logo.png" alt="Logo" class="h-20 object-contain drop-shadow-2xl" />
                        </div>
                        <div class="flex-1 flex flex-col items-end space-y-1">
                            <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">警长任命</span>
                            <select 
                                onchange="handleSheriffChange(this.value)"
                                class="bg-slate-800 text-indigo-400 text-xs font-bold rounded-lg px-2 py-1 border border-slate-700 outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm"
                            >
                                ${selectOptions}
                            </select>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto mb-6 pr-1 custom-scrollbar">
                        <div class="grid grid-flow-col grid-rows-6 gap-3">
                            ${playersCards}
                        </div>
                    </div>

                    <button 
                        onclick="startVoting()"
                        ${aliveList.length === 0 ? 'disabled' : ''}
                        class="w-full bg-rose-600 hover:bg-rose-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold py-4 px-4 rounded-xl shadow-lg shadow-rose-900/50 flex items-center justify-center space-x-2 transition active:scale-95 mb-4"
                    >
                        <i data-lucide="users" class="w-6 h-6 mr-2"></i>
                        <span class="text-lg">发起投票</span>
                    </button>

                    <button 
                        onclick="setState({phase: 'settlement'})"
                        class="w-full bg-slate-800 hover:bg-slate-700 text-indigo-400 font-bold py-4 px-4 rounded-xl border border-slate-700 flex items-center justify-center space-x-2 transition active:scale-95 mb-2 shadow-lg"
                    >
                        <i data-lucide="calculator" class="w-6 h-6 mr-2"></i>
                        <span class="text-lg">本局结束统计分值！</span>
                    </button>
                    
                    <button 
                        onclick="handleReviveAll()"
                        class="w-full bg-slate-900/50 hover:bg-slate-900 text-rose-500/80 font-medium py-2 rounded-lg text-xs transition flex items-center justify-center"
                    >
                        <i data-lucide="rotate-ccw" class="w-3 h-3 mr-1"></i>
                        全员复活并重置本局
                    </button>
                </div>
            `;
        }

        function renderCampaign() {
            let playerCards = '';
            state.players.forEach(p => {
                const isSelected = state.localCampaigning.includes(p.id);
                const cardBgClass = isSelected 
                    ? 'bg-indigo-600/20 border-indigo-500 shadow-lg shadow-indigo-900/20' 
                    : 'bg-slate-900/40 border-slate-800 opacity-60 grayscale';
                const numBgClass = isSelected ? 'bg-indigo-600 text-white border-indigo-400' : 'bg-slate-700 text-slate-500 border-slate-600';
                const nameClass = isSelected ? 'text-white' : 'text-slate-500';
                
                playerCards += `
                    <div 
                        onclick="toggleCampaigningLocal(${p.id})"
                        class="relative p-3 rounded-2xl border flex items-center space-x-3 transition cursor-pointer active:scale-[0.98] ${cardBgClass}"
                    >
                        <div class="relative flex-shrink-0">
                            <img src="${p.avatar}" class="w-8 h-8 rounded-full object-cover" />
                            <div class="absolute -top-1 -left-1 text-[8px] w-4 h-4 rounded-full flex items-center justify-center border font-black ${numBgClass}">
                                ${p.id}
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-bold truncate ${nameClass}">${p.name}</p>
                        </div>
                        ${isSelected ? '<div class="w-4 h-4 bg-indigo-500 rounded-full flex items-center justify-center"><i data-lucide="check" class="w-2 h-2 text-white"></i></div>' : ''}
                    </div>
                `;
            });

            return `
                <div class="flex flex-col h-full animate-fade-in">
                    <div class="text-center mb-6 pt-6">
                        <h2 class="text-2xl font-bold text-white tracking-tight">上警/竞选管理</h2>
                        <p class="text-slate-400 text-[10px] mt-1 uppercase tracking-widest">选择参与警长竞选的玩家</p>
                    </div>

                    <div class="flex-1 overflow-y-auto mb-6 pr-1 custom-scrollbar">
                        <div class="grid grid-flow-col grid-rows-6 gap-3">
                            ${playerCards}
                        </div>
                    </div>

                    <button 
                        onclick="confirmCampaigning()"
                        class="w-full bg-slate-100 text-slate-900 font-black py-4 rounded-2xl shadow-xl transition active:scale-95 mb-4"
                    >
                        确认并返回
                    </button>
                </div>
            `;
        }

        function renderVoting() {
            const alive = getAlivePlayers();
            const currentVoter = alive[state.currentVoterIndex];
            if (!currentVoter) return '';

            let sheriffBadge = '';
            let avatarBorder = 'border-indigo-500';
            if (currentVoter.isSheriff) {
                avatarBorder = 'border-yellow-500';
                sheriffBadge = `
                    <div class="absolute -top-2 -right-2 bg-yellow-500 text-slate-900 w-5 h-5 sm:w-6 sm:h-6 rounded-full flex items-center justify-center border-2 border-slate-900 shadow-lg z-10">
                        <i data-lucide="shield-check" class="w-3 h-3"></i>
                    </div>
                `;
            }

            let targetCards = '';
            alive.forEach(p => {
                const isSelf = p.id === currentVoter.id;
                const cardBgClass = isSelf 
                    ? 'bg-slate-900/50 border-slate-800 text-slate-500 grayscale' 
                    : 'bg-slate-800 border-slate-700 hover:border-rose-500 text-slate-100 hover:bg-slate-700/50 shadow-md';
                
                targetCards += `
                    <button
                        onclick="${isSelf ? '' : `castVote(${p.id})`}"
                        class="flex flex-col items-center justify-center py-3 px-1 rounded-xl border transition active:scale-[0.98] ${cardBgClass}"
                    >
                        <div class="relative mb-2">
                            <img src="${p.avatar}" class="w-11 h-11 rounded-full object-cover border border-slate-600" />
                            <div class="absolute -top-2 -left-2 text-white text-[9px] w-5 h-5 rounded-full flex items-center justify-center border font-black shadow-sm ${isSelf ? 'bg-slate-700 border-slate-600' : 'bg-slate-800 border-slate-600'}">
                                ${p.id}
                            </div>
                        </div>
                        <span class="text-xs font-bold truncate w-full text-center px-1">${p.name}</span>
                        ${isSelf ? '<span class="text-[8px] mt-0.5 text-slate-600 scale-90">投自己</span>' : ''}
                    </button>
                `;
            });

            return `
                <div class="flex flex-col h-full animate-fade-in">
                    <div class="bg-slate-800 p-3 sm:p-4 rounded-2xl border border-indigo-500/30 mb-4 mt-2 shadow-lg flex justify-between items-center relative">
                        <div class="flex items-center space-x-3 sm:space-x-4 flex-1 min-w-0">
                            <div class="relative flex-shrink-0">
                                <img src="${currentVoter.avatar}" class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl object-cover border-2 ${avatarBorder}" />
                                ${sheriffBadge}
                                <div class="absolute -top-2 -left-2 bg-indigo-600 text-white text-[10px] sm:text-xs w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center border-2 border-indigo-400 font-black shadow-lg">
                                    ${currentVoter.id}
                                </div>
                            </div>
                            <div class="flex flex-col min-w-0 pr-2">
                                <p class="text-indigo-400 text-[9px] sm:text-xs font-bold mb-0.5 uppercase tracking-wider truncate">正在投票 (${state.currentVoterIndex + 1}/${alive.length}) ${currentVoter.isSheriff ? '· 警长' : ''}</p>
                                <h2 class="text-lg sm:text-2xl font-bold text-white truncate">${currentVoter.name}</h2>
                            </div>
                        </div>
                        
                        <div class="flex-shrink-0 ml-1 transform -rotate-[12deg] border-[3px] border-rose-600/90 rounded-xl px-2 py-1 shadow-sm">
                            <span class="text-rose-600/90 font-black text-lg sm:text-2xl tracking-widest whitespace-nowrap block leading-none">投票给</span>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto pr-1 custom-scrollbar grid grid-cols-3 gap-2 content-start mb-2">
                        ${targetCards}
                    </div>

                    <div class="grid grid-cols-3 gap-3 mt-4 pt-4 border-t border-slate-800 pb-3">
                        <button onclick="prevVoter()" ${state.currentVoterIndex === 0 ? 'disabled' : ''} class="col-span-1 py-3 rounded-xl bg-slate-800 text-slate-300 disabled:opacity-30 font-medium transition active:scale-95">上一步</button>
                        <button onclick="castVote('abstain')" class="col-span-2 py-3 rounded-xl bg-slate-700 border border-slate-600 text-white font-medium shadow-md transition active:scale-95">弃票 (Abstain)</button>
                    </div>
                    <button onclick="setState({phase: 'day'})" class="w-full py-3 rounded-xl bg-slate-900/50 hover:bg-slate-900 text-slate-500 font-medium transition active:scale-95 mb-4 border border-slate-800/50">
                        返回游戏主界面
                    </button>
                </div>
            `;
        }

        function renderResult() {
            const results = getVoteResults();
            const alive = getAlivePlayers();
            
            let headingTag = '';
            if (results.maxVotes === 0) {
                headingTag = '<span class="text-amber-400 bg-amber-900/30 py-1 px-3 rounded-full text-xs font-bold border border-amber-500/30">全员弃票</span>';
            } else if (results.isTie) {
                headingTag = `<span class="text-amber-400 bg-amber-900/30 py-1 px-3 rounded-full text-xs font-bold border border-amber-500/30">出现平票 (${results.maxVotes}票)</span>`;
            } else {
                headingTag = `<span class="text-rose-400 bg-rose-900/30 py-1 px-3 rounded-full text-xs font-bold border border-rose-500/30">最高票: ${results.targetsWithMax.map(id => `${id}号`).join(', ')} (${results.maxVotes}票)</span>`;
            }

            let resultCards = '';
            alive.filter(p => results.counts[p.id] > 0).sort((a, b) => results.counts[b.id] - results.counts[a.id]).forEach(p => {
                const isMax = results.targetsWithMax.includes(p.id) && results.maxVotes > 0;
                const cardBgClass = isMax ? 'bg-rose-900/20 border-rose-500/50' : 'bg-slate-800 border-slate-700';
                const numBgClass = isMax ? 'bg-rose-600 text-white border-rose-400' : 'bg-slate-700 text-slate-300 border-slate-600';
                const nameClass = isMax ? 'text-rose-400' : 'text-slate-100';

                let detailsTags = '';
                results.details[p.id].forEach(v => {
                    detailsTags += `<span class="text-[10px] bg-slate-700/50 text-slate-300 px-2 py-0.5 rounded">${v}</span>`;
                });

                let exileButton = '';
                if (isMax && !results.isTie) {
                    exileButton = `<button onclick="executeElimination(${p.id})" class="mt-4 w-full bg-rose-600 text-white py-2.5 rounded-lg font-bold text-sm shadow-lg shadow-rose-900/50">执行放逐</button>`;
                }

                resultCards += `
                    <div class="p-4 rounded-xl border ${cardBgClass}">
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex items-center space-x-3">
                                <div class="relative">
                                    <img src="${p.avatar}" class="w-10 h-10 rounded-full object-cover" />
                                    <div class="absolute -top-1 -left-1 text-[10px] w-5 h-5 rounded-full flex items-center justify-center border font-bold ${numBgClass}">
                                        ${p.id}
                                    </div>
                                </div>
                                <span class="text-lg font-bold ${nameClass}">${p.name}</span>
                            </div>
                            <span class="text-2xl font-black text-slate-100">${results.counts[p.id]}<span class="text-xs ml-1 text-slate-500">票</span></span>
                        </div>
                        <div class="flex flex-wrap gap-1">
                            ${detailsTags}
                        </div>
                        ${exileButton}
                    </div>
                `;
            });

            let abstainSection = '';
            if (results.abstainCount > 0) {
                let abstainDetailsTags = '';
                results.abstainDetails.forEach(v => {
                    abstainDetailsTags += `<span class="text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-800/30">${v}</span>`;
                });

                abstainSection = `
                    <div class="p-3 rounded-xl bg-slate-900/30 border border-slate-800">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-slate-500">弃票</span>
                            <span class="text-lg font-bold text-slate-400">${results.abstainCount}票</span>
                        </div>
                        <div class="flex flex-wrap gap-1">
                            ${abstainDetailsTags}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="flex flex-col h-full animate-fade-in">
                    <div class="text-center mb-8 pt-6">
                        <h2 class="text-2xl font-bold text-slate-100">投票统计</h2>
                        <div class="mt-3 inline-flex flex-wrap justify-center gap-2">
                            ${headingTag}
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto mb-6 pr-1 space-y-3 custom-scrollbar">
                        ${resultCards}
                        ${abstainSection}
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <button onclick="setState({phase: 'day'})" class="bg-slate-800 text-slate-300 py-4 rounded-xl font-bold border border-slate-700">返回</button>
                        <button onclick="confirmAndContinueResult()" class="bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-indigo-900/50">确认并继续</button>
                    </div>
                </div>
            `;
        }

        // 积分结算模块的 HTML 渲染
        function renderSettlement() {
            const settlementData = getSettlementData();
            let scoreRows = '';
            
            settlementData.forEach(p => {
                let scoreClass = 'text-slate-500';
                let scoreStr = `${p.score}`;
                if (p.score > 0) {
                    scoreClass = 'text-emerald-400';
                    scoreStr = `+${p.score}`;
                } else if (p.score < 0) {
                    scoreClass = 'text-rose-400';
                }

                let detailLines = '';
                p.details.forEach(d => {
                    let hitClass = 'text-slate-400';
                    let hitText = '';
                    if (d.isHit === true) {
                        hitClass = 'text-emerald-500';
                        hitText = '(命中狼)';
                    } else if (d.isHit === false) {
                        hitClass = 'text-rose-500';
                        hitText = '(误伤)';
                    }
                    
                    detailLines += `
                        <div class="flex justify-between text-[10px]">
                            <span class="text-slate-500">Day${d.round} 投票给:</span>
                            <span class="${hitClass}">
                                ${d.target} ${hitText}
                            </span>
                        </div>
                    `;
                });

                if (p.details.length === 0) {
                    detailLines = '<p class="text-center text-[10px] text-slate-600 py-2">无投票记录</p>';
                }

                scoreRows += `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-xl">
                        <div class="flex justify-between items-center mb-4">
                            <div class="flex items-center space-x-3">
                                <div class="relative">
                                    <img src="${p.avatar}" class="w-12 h-12 rounded-full border-2 border-slate-700 object-cover" />
                                    <div class="absolute -top-1 -left-1 bg-indigo-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center border border-indigo-400 font-bold">
                                        ${p.id}
                                    </div>
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-100">${p.name}</h3>
                                    <span class="text-[10px] bg-indigo-900/30 text-indigo-400 px-2 py-0.5 rounded border border-indigo-500/20">${p.identity}</span>
                                </div>
                            </div>
                            <div class="text-3xl font-black italic ${scoreClass}">
                                ${scoreStr}
                            </div>
                        </div>
                        <div class="space-y-1.5 pt-3 border-t border-slate-700/30">
                            ${detailLines}
                        </div>
                    </div>
                `;
            });

            return `
                <div class="flex flex-col h-full animate-fade-in">
                    <div class="text-center mb-6 pt-8">
                        <h2 class="text-2xl font-bold text-slate-100 tracking-tight">好人阵营积分统计</h2>
                        <div class="mt-2 text-[10px] text-slate-500 flex justify-center space-x-4">
                            <span class="flex items-center"><div class="w-2 h-2 rounded-full bg-emerald-500 mr-1"></div>投中狼人 +0.5</span>
                            <span class="flex items-center"><div class="w-2 h-2 rounded-full bg-rose-500 mr-1"></div>投错好人 -0.5</span>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto mb-6 pr-1 custom-scrollbar space-y-3">
                        ${scoreRows}
                    </div>

                    <button onclick="setState({phase: 'day'})" class="w-full bg-slate-800 text-slate-300 font-bold py-4 rounded-xl border border-slate-700 mb-3 transition active:scale-95">返回游戏</button>
                    
                    <button 
                        onclick="uploadScores()"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-900/50 transition active:scale-95 flex items-center justify-center space-x-2"
                    >
                        <i data-lucide="upload-cloud" class="w-5 h-5"></i>
                        <span>上传统计分值！</span>
                    </button>
                </div>
            `;
        }

        function renderDeathModal() {
            if (!state.deathMenuId) return '';
            const victim = state.players.find(p => p.id === state.deathMenuId);
            const victimName = victim ? victim.name : '';

            let buttons = '';
            ['毒杀', '枪杀', '放逐', '狼刀', '狼技', '自爆'].forEach(cause => {
                buttons += `
                    <button
                        onclick="confirmDeath(${state.deathMenuId}, '${cause}')"
                        class="py-4 bg-slate-800 hover:bg-slate-700 text-slate-100 font-bold rounded-xl border border-slate-700 transition active:scale-95"
                    >
                        ${cause}
                    </button>
                `;
            });

            return `
                <div class="absolute inset-0 z-[100] flex items-center justify-center p-6 animate-fade-in">
                    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" onclick="setState({deathMenuId: null})"></div>
                    <div class="relative w-full max-w-xs bg-slate-900 border border-slate-700 rounded-3xl p-6 shadow-2xl shadow-black">
                        <h3 class="text-xl font-bold text-white mb-6 text-center">选择 ${victimName} 的死因</h3>
                        <div class="grid grid-cols-2 gap-3">
                            ${buttons}
                        </div>
                        <button 
                            onclick="setState({deathMenuId: null})"
                            class="mt-6 w-full py-3 text-slate-500 font-medium hover:text-slate-300 transition"
                        >
                            取消
                        </button>
                    </div>
                </div>
            `;
        }

        // 主渲染入口
        function render() {
            const root = document.getElementById('root');
            let content = '';

            content += `
            <div class="min-h-screen flex justify-center bg-slate-950">
                <div class="w-full max-w-md h-screen max-h-screen flex flex-col relative sm:border-x sm:border-slate-800">
                    <div class="h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-rose-500 w-full z-20 flex-shrink-0"></div>
                    <div class="flex-1 p-6 overflow-hidden flex flex-col">
            `;

            if (state.phase === 'setup') {
                content += renderSetup();
            } else if (state.phase === 'day') {
                content += renderDay();
            } else if (state.phase === 'voting') {
                content += renderVoting();
            } else if (state.phase === 'result') {
                content += renderResult();
            } else if (state.phase === 'settlement') {
                content += renderSettlement();
            } else if (state.phase === 'campaign') {
                content += renderCampaign();
            }

            content += `
                    </div>
                    ${renderDeathModal()}
                </div>
            </div>
            `;

            root.innerHTML = content;

            // 重新编译渲染 Lucide 图标
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        function init() {
            // 首次立即渲染界面
            render();

            // 首次拉取数据
            fetchInitialData();
            
            // 实时订阅游戏状态更新
            if (supabaseClient) {
                try {
                    supabaseClient
                        .channel('public:current_game_state')
                        .on('postgres_changes', { 
                            event: 'UPDATE', 
                            schema: 'public', 
                            table: 'current_game_state', 
                            filter: 'id=eq.1' 
                        }, payload => {
                            handleStateUpdate(payload.new);
                        })
                        .subscribe();
                } catch (err) {
                    console.error('Supabase subscription error:', err);
                }
            }
        }

        // 页面初始化加载与订阅
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
